html.ciemny{--tlo:#0B0F0D;--pow:#121915;--pow2:#101613;--pow3:#18211C;--wybrany:#16201B;--linia:#1E2823;--ramka:#24302A;--ramka2:#33423A;--tekst:#EEF4F0;--tekst2:#9DAEA4;--tekst3:#85948B;--akcja:#5DFF8A;--naAkcji:#052012;--wolne:#5DFF8A;--pelne:#FFC85C;--zaduzo:#FF7A7A;--moc:#7CC0FF;--odwrotne:#EEF4F0;--naOdwrotnym:#0B0F0D;--aktywny:#EEF4F0;--naAktywnym:#0B0F0D;--nieaktywny:#C9D6CF;--cien:rgba(0,0,0,.5);--wylaczony:#1F2924;--naWylaczonym:#85948B;--okTlo:#14241B;--okRamka:#2F6B47;--okTekst:#8CF5B0;--uwTlo:#2A2213;--uwRamka:#6E5422;--uwTekst:#FFD27A;--blTlo:#2A1616;--blRamka:#5C2B2B;--blTekst:#FF9B9B;--mocTlo:#15283D;--mocRamka:#2B4C70;--mocTekst:#9CCFFF;--zaslona:rgba(0,0,0,.62);--slupek:#3A4A41;--FQ:#6FD39A;--FP:#5CC7D2;--FO:#9DB3F0;--RQ:#B69CFF;--RP:#E39BD0;--RK:#FF8AB8;--MG:#E2B176;color-scheme:dark}
html.jasny{--tlo:#F3F6F4;--pow:#FFFFFF;--pow2:#FAFCFB;--pow3:#EEF3F0;--wybrany:#E6F3EA;--linia:#DCE4DF;--ramka:#D3DDD7;--ramka2:#C2CFC8;--tekst:#13201A;--tekst2:#4B5D53;--tekst3:#5F7067;--akcja:#0F7A39;--naAkcji:#FFFFFF;--wolne:#0F7A39;--pelne:#9A5B00;--zaduzo:#C62828;--moc:#1E63B5;--odwrotne:#13201A;--naOdwrotnym:#FFFFFF;--aktywny:#13201A;--naAktywnym:#FFFFFF;--nieaktywny:#3B4C43;--cien:rgba(19,32,26,.18);--wylaczony:#E3EAE6;--naWylaczonym:#5F7067;--okTlo:#E6F5EC;--okRamka:#8CCBA3;--okTekst:#145C33;--uwTlo:#FFF4DE;--uwRamka:#E3BE73;--uwTekst:#7A4700;--blTlo:#FDECEC;--blRamka:#EBB4B4;--blTekst:#9E1C1C;--mocTlo:#E2EDFB;--mocRamka:#93B6E6;--mocTekst:#1C4F8F;--zaslona:rgba(19,32,26,.42);--slupek:#C2CFC8;--FQ:#2E7D4F;--FP:#16727C;--FO:#2B3E6E;--RQ:#6A4C9C;--RP:#7D3C6B;--RK:#B03A72;--MG:#9C6B30;color-scheme:light}
[hidden]{display:none!important}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
*{-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--ramka2);border-radius:3px}
input::placeholder,textarea::placeholder{color:var(--tekst3)}
input[type="search"]{-webkit-appearance:none;appearance:none}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--tlo);color:var(--tekst);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;text-align:inherit}
button:disabled,button[aria-disabled="true"]{cursor:default}
button:active:not(:disabled):not([aria-disabled="true"]){filter:brightness(.93)}
:focus{outline:none}
:focus-visible{outline:3px solid var(--moc);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--tekst)}
svg{display:block;flex:0 0 auto}
p{margin:0}
.bebas{font-family:"Bebas Neue","Avenir Next Condensed","Roboto Condensed","Arial Narrow",Inter,sans-serif;font-weight:400;letter-spacing:.05em;line-height:1}
.etykieta{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--tekst3)}
.cyfry{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
@keyframes potrzasnij{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.potrzasnij{animation:potrzasnij .4s ease}
@keyframes mrug{50%{opacity:0}}
@keyframes wjazd{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.potrzasnij,.kursor,.arkusz,#toast{animation:none!important}}

/* nagłówek — jak w Tablicy */
.nag{flex:0 0 auto;height:60px;display:flex;align-items:center;gap:14px;padding:0 12px 0 20px;border-bottom:1px solid var(--linia);background:var(--tlo);position:relative;z-index:5}
.nag-l{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.nag-tyt{font-size:30px;padding-top:3px;white-space:nowrap}
.nag-s{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:10px}
.nag-p{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.nag-data{font-size:14px;color:var(--tekst2);white-space:nowrap}
.nag-zegar{font-size:30px;padding-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pol{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--wolne)}
.pol .kropka{width:8px;height:8px;border-radius:50%;background:currentColor}
.pol[data-stan="offline"]{color:var(--zaduzo)}
.pol[data-stan="wysyla"]{color:var(--pelne)}
.menu-btn{height:42px;max-width:170px;padding:0 10px 0 6px;border-radius:11px;border:1px solid var(--ramka);background:var(--pow);color:var(--tekst);display:flex;align-items:center;gap:8px;min-width:0}
.awatar{width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:var(--pow3);border:1px solid var(--ramka2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.awatar.duzy{width:36px;height:36px;flex-basis:36px;font-size:16px}
.menu-imie{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip-rola{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--ramka);background:var(--pow);font-size:14px;font-weight:700;white-space:nowrap;min-width:0;max-width:100%}
.chip-rola span{overflow:hidden;text-overflow:ellipsis}
.chip-rola::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--kol);flex:0 0 auto}
.postep{font-size:14px;font-weight:700;color:var(--tekst2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border-radius:10px;font-variant-numeric:tabular-nums;flex:0 0 auto}
button.postep{border:1px solid var(--ramka);background:var(--pow);color:var(--tekst)}
.pasek-p{height:3px;background:var(--linia);flex:0 0 auto}
.pasek-p>i{display:block;height:100%;background:var(--kol,var(--akcja));transition:width .3s}
@media (max-width:760px){.nag{padding:0 10px 0 14px;gap:8px;height:56px}.nag-tyt{font-size:26px}.nag-data,.menu-imie,.pol .pol-t{display:none}.nag-zegar{font-size:24px}.menu-btn{padding:0 5px;gap:4px}.nag-p{gap:8px}.postep{padding:0 8px}}
@media (max-width:400px){.chip-rola{display:none}}

/* przyciski wspólne */
.glowny{height:58px;padding:0 24px;border-radius:16px;background:var(--akcja);color:var(--naAkcji);font-size:18px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-align:center}
.glowny:disabled,.glowny[aria-disabled="true"]{background:var(--wylaczony);color:var(--naWylaczonym)}
.drugi{min-height:48px;padding:0 16px;border-radius:14px;border:1px solid var(--ramka2);background:transparent;color:var(--tekst);font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.drugi.maly{min-height:38px;padding:0 12px;border-radius:11px;font-size:14px}
.link{display:inline-flex;align-items:center;gap:6px;color:var(--mocTekst);font-weight:700;font-size:14px;min-height:36px}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:11px;background:var(--pow);border:1px solid var(--ramka)}
.seg button{height:34px;min-width:46px;padding:0 12px;border-radius:8px;font-size:14px;font-weight:700;color:var(--nieaktywny);display:flex;align-items:center;justify-content:center}
.seg button[aria-pressed="true"]{background:var(--aktywny);color:var(--naAktywnym)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:3px 10px;border-radius:8px;border:1px solid var(--ramka);background:var(--pow);font-size:13px;font-weight:600;color:var(--tekst2)}
.chip b{color:var(--tekst)}
.chip.nob{border-color:var(--uwRamka);color:var(--uwTekst);background:var(--uwTlo)}
.chip.cz{border-color:var(--mocRamka);color:var(--mocTekst);background:var(--mocTlo)}
.kl{height:72px;border-radius:18px;border:1px solid var(--ramka);background:var(--pow);color:var(--tekst);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center}
.kl.maly{font-size:16px;font-weight:700;color:var(--tekst2)}

/* start i PIN */
.przew{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.start-w{width:min(760px,100%);margin:0 auto;padding:28px 16px 36px;display:flex;flex-direction:column;gap:18px}
.start-gora{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.start-logo{font-size:56px}
.start-pod{font-size:14px;color:var(--tekst2);display:block;margin-top:6px}
.kafelki{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kafel{min-height:96px;padding:12px 14px;border-radius:16px;border:1px solid var(--ramka);background:var(--pow);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;text-align:left}
.kafel-imie{font-size:18px;font-weight:800}
.kafel-konto{font-size:12px;color:var(--tekst2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.znacznik{display:inline-block;padding:0 5px;border-radius:5px;border:1px solid var(--ramka2);font-size:11px;font-weight:700;color:var(--tekst2);line-height:16px}
.kafel-inna{border-style:dashed;border-color:var(--ramka2);background:transparent;color:var(--tekst2);font-size:16px;font-weight:700;align-items:center}
.wskazowki{border:1px solid var(--ramka);background:var(--pow);border-radius:16px;padding:14px 16px;display:grid;gap:8px}
.wskazowki ol{margin:0;padding-left:1.3em;display:grid;gap:6px;color:var(--tekst2);font-size:14px;max-width:72ch}
.wskazowki b{color:var(--tekst)}
.start-stopka{font-size:13px;color:var(--tekst3);max-width:72ch}
.pin{width:min(400px,100%);align-self:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.pin-imie{font-size:28px;font-weight:800}
.pin-pod{font-size:15px;color:var(--tekst2)}
.kropki{display:flex;gap:12px;height:22px;align-items:center}
.kropki span{width:16px;height:16px;border-radius:8px;border:2px solid var(--ramka2)}
.kropki span.p{background:var(--tekst);border-color:var(--tekst)}
.klaw-pin{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pin-hint{font-size:13px;color:var(--tekst2);text-align:center}

/* wybór roli */
.rola-w{width:min(900px,100%);margin:0 auto;padding:22px 16px 28px;display:flex;flex-direction:column;gap:20px}
.rola-gora{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.h1{font-size:26px;font-weight:800;margin:0;line-height:1.2;text-wrap:balance}
.pod{font-size:14px;color:var(--tekst2);margin-top:6px;max-width:60ch}
.jezyk{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.jezyk small{font-size:12px;color:var(--tekst3)}
.grupa-rol{display:flex;flex-direction:column;gap:8px}
.grupa-rol-nag{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.grupa-rol-nag span:last-child{font-size:13px;color:var(--tekst2)}
.rol-siatka{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.rola-k{position:relative;display:flex;align-items:stretch;min-height:98px;border-radius:16px;border:1px solid var(--ramka);background:var(--pow);text-align:left;overflow:hidden}
.rola-k .pas{width:8px;background:var(--kol);flex:0 0 8px}
.rola-k .tr{flex:1;min-width:0;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.rola-k .naz{font-size:17px;font-weight:800;line-height:1.25}
.rola-k.z-ost .naz{padding-right:96px}
.rola-k .meta{font-size:13px;color:var(--tekst2)}
.rola-k .st{font-size:13px;font-weight:600;color:var(--tekst3)}
.rola-k .st.ok{color:var(--okTekst)}
.rola-k .st.toku{color:var(--mocTekst)}
.rola-k.wyb{border-color:var(--kol);box-shadow:0 0 0 2px var(--kol)}
.rola-k[aria-disabled="true"]{opacity:.6}
.rola-k .ost{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--pow3);color:var(--tekst2)}
.karta-kier{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;border:1px solid var(--mocRamka);background:var(--mocTlo);color:var(--mocTekst);text-align:left}
.karta-kier b{display:block;font-size:17px;color:var(--tekst)}
.stopka{flex:0 0 auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--linia);background:var(--tlo);display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}
.stopka .glowny{min-width:min(360px,100%)}
.stopka-info{font-size:13px;color:var(--tekst2);text-align:center;width:100%}

/* liczenie */
.baner{flex:0 0 auto;padding:9px 20px;background:var(--mocTlo);color:var(--mocTekst);border-bottom:1px solid var(--mocRamka);font-size:14px;font-weight:600;display:flex;gap:10px 14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.baner.uw{background:var(--uwTlo);color:var(--uwTekst);border-color:var(--uwRamka)}
.baner.bl{background:var(--blTlo);color:var(--blTekst);border-color:var(--blRamka)}
.uklad{flex:1;min-height:0;display:grid;grid-template-columns:minmax(290px,340px) minmax(0,1fr) minmax(330px,400px)}
.panel-lista{border-right:1px solid var(--linia);display:flex;flex-direction:column;min-height:0;background:var(--pow2)}
.lista{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:6px}
.gr-nag{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px 6px;background:var(--pow2);border-bottom:1px solid var(--linia)}
.gr-naz{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tekst3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.gr-licz{font-size:12px;font-weight:700;color:var(--tekst3);font-variant-numeric:tabular-nums;flex:0 0 auto}
.gr-licz.pelna{color:var(--okTekst)}
.wiersz{width:100%;display:flex;align-items:center;gap:10px;padding:8px 14px 8px 16px;border-bottom:1px solid var(--linia);text-align:left;min-height:52px;position:relative}
.wiersz.biez{background:var(--wybrany)}
.wiersz.biez::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--kol)}
.w-n{flex:1;min-width:0;display:flex;flex-direction:column}
.w-n1{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-n2{font-size:12px;color:var(--tekst3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-v{flex:0 0 auto;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px}
.w-v small{font-size:11px;font-weight:600;color:var(--tekst3);margin-left:2px}
.w-pusty{color:var(--tekst3);font-weight:500}
.wiersz.ostrz .w-v{color:var(--uwTekst)}
.w-ik{color:var(--pelne)}
.lista-ukryte{padding:12px 16px;font-size:13px;color:var(--tekst3)}
.lista-dol{flex:0 0 auto;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--linia);display:flex;flex-direction:column;gap:6px;background:var(--pow2)}
.lista-dol .glowny{width:100%;height:52px;font-size:16px}
.lista-dol small{font-size:12px;color:var(--tekst3);text-align:center}
.panel-info{min-width:0;overflow-y:auto;padding:24px 26px;display:flex;flex-direction:column;gap:14px}
.panel-klaw{min-width:0;border-left:1px solid var(--linia);padding:18px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.i-gora{display:flex;align-items:center;gap:10px;justify-content:space-between;min-height:30px}
.i-gora .etykieta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.i-poz{font-size:13px;font-weight:700;color:var(--tekst3);font-variant-numeric:tabular-nums;white-space:nowrap}
.k-lista{display:none}
.i-n1{font-size:36px;font-weight:800;line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
.i-n2{font-size:16px;color:var(--tekst2);margin-top:-6px;overflow-wrap:anywhere}
.i-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.i-podp{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;font-size:15px;color:var(--tekst2)}
.i-podp b{color:var(--tekst);font-variant-numeric:tabular-nums}
.wykres-w{border:1px solid var(--ramka);background:var(--pow);border-radius:16px;padding:12px 12px 8px;display:flex;flex-direction:column;gap:6px}
.wykres-w svg{width:100%;height:auto}
.wysw{display:flex;align-items:center;justify-content:flex-end;gap:10px;min-height:104px;padding:8px 20px;border-radius:18px;border:2px solid var(--ramka2);background:var(--pow)}
.wysw .lb{font-family:"Bebas Neue","Avenir Next Condensed","Roboto Condensed",Inter,sans-serif;font-size:84px;line-height:1;letter-spacing:.02em;padding-top:8px;white-space:nowrap}
.wysw .jd{font-size:20px;font-weight:700;color:var(--tekst2);align-self:flex-end;padding-bottom:16px}
.wysw.pusty .lb{color:var(--tekst3)}
.wysw.pisze{border-color:var(--kol)}
.wysw.uw{border-color:var(--uwRamka);background:var(--uwTlo)}
.kursor{display:inline-block;width:3px;height:56px;border-radius:2px;background:var(--kol);animation:mrug 1s steps(1) infinite}

.szukaj{height:46px;width:100%;padding:0 14px;border-radius:12px;border:1px solid var(--ramka2);background:var(--pow2);font-size:16px;outline:none;-webkit-user-select:text;user-select:text}

/* warstwy: menu, arkusze */

.menu-sekcja{display:flex;flex-direction:column;gap:8px}

.przelacznik{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;padding:8px 14px;border-radius:14px;border:1px solid var(--ramka);background:var(--pow);text-align:left}

.pole-uw{width:100%;min-height:84px;padding:12px 14px;border-radius:12px;border:1px solid var(--ramka2);background:var(--pow);font-size:16px;resize:vertical;outline:none;-webkit-user-select:text;user-select:text}

.info-ok{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid var(--okRamka);background:var(--okTlo);color:var(--okTekst);font-weight:700;font-size:15px}

#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:max-content;max-width:min(560px,calc(100% - 32px));padding:12px 18px;border-radius:14px;background:var(--odwrotne);color:var(--naOdwrotnym);font-size:14px;font-weight:600;box-shadow:0 10px 30px var(--cien);z-index:60;text-align:center;animation:wjazdT .18s ease;pointer-events:none}

/* ===== aplikacja produkcyjna: logowanie, ładowanie, konto, nowa wersja ===== */
.pole{height:56px;width:100%;padding:0 16px;border-radius:14px;border:1px solid var(--ramka2);background:var(--pow);color:var(--tekst);font-size:20px;outline:none;-webkit-user-select:text;user-select:text}

.pole-l{display:flex;flex-direction:column;gap:6px}
.logowanie{width:min(420px,100%);align-self:center;display:flex;flex-direction:column;gap:12px}
.logowanie .glowny,.pin .glowny{width:100%}
.blad-t{min-height:20px;font-size:14px;font-weight:700;color:var(--zaduzo);text-align:center}
.pod-t{font-size:13px;color:var(--tekst2)}
.kafel-w{position:relative}
.kafel-w .kafel{width:100%}
.kafel-x{position:absolute;top:-8px;right:-8px;width:34px;height:34px;border-radius:17px;background:var(--zaduzo);color:var(--naOdwrotnym);font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center}
.start-rzad{display:flex;align-items:center;justify-content:space-between;gap:10px}

.hist-ladowanie{font-size:14px;color:var(--tekst2);padding:8px 0}

a.drugi{text-decoration:none;color:var(--tekst)}
